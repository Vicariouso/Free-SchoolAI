<style>
/* School Prompts intranet library. System fonts only: nothing loads from outside. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-2: #f8fafc;
  --surface: #ffffff;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-ink: #1e40af;
  --on-accent: #ffffff;
  --warn-soft: #fffbeb;
  --warn-ink: #92400e;
  --warn-line: #f3c37a;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.08);
  --radius: 10px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --bg-2: #0f172a;
    --surface: #111b2e;
    --ink: #f1f5f9;
    --ink-2: #cbd5e1;
    --muted: #94a3b8;
    --line: #1f2b3f;
    --line-strong: #334155;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --accent-soft: #172554;
    --accent-ink: #bfdbfe;
    --on-accent: #0b1220;
    --warn-soft: #3b2a07;
    --warn-ink: #fbbf24;
    --warn-line: #7c5a12;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-hover); }
h1, h2, h3, p, ul, ol { margin: 0; }
h1 { margin-top: 0.5rem; font-size: clamp(1.9rem, 4.5vw, 2.75rem); line-height: 1.1; letter-spacing: -0.02em; }
h2 { font-size: 1.25rem; line-height: 1.3; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { width: min(100% - 2rem, 72rem); margin-inline: auto; }
#main { padding-block: 2rem 3rem; }
#app { display: flex; flex-direction: column; gap: 1.25rem; }
.skip { position: absolute; left: -999px; top: 0.5rem; padding: 0.5rem 0.75rem; background: var(--surface); }
.skip:focus { left: 0.5rem; }
.sr-only, .offscreen { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.lead { max-width: 46rem; color: var(--ink-2); font-size: 1.075rem; }
.note { color: var(--muted); font-size: 0.875rem; }
.meta { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.meta.accent { color: var(--accent); }

.callout { padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--accent-soft); color: var(--ink-2); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.callout-title { font-weight: 700; color: var(--ink); margin-bottom: 0.2rem; }

.input { width: 100%; min-height: 44px; padding: 0.55rem 0.8rem; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.95rem; }
.input[readonly] { background: var(--bg-2); color: var(--muted); }
textarea.input { resize: vertical; min-height: 9rem; }
.searchbar { position: sticky; top: 0; z-index: 10; display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.search-label { font-weight: 700; }
.search { min-height: 52px; font-size: 1.05rem; }
.chips { display: flex; gap: 0.45rem; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips:empty { display: none; }
@media (min-width: 768px) { .chips { flex-wrap: wrap; overflow: visible; } }
.chip { flex: none; min-height: 36px; padding: 0.3rem 0.85rem; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
.chip.small { min-height: 32px; font-size: 0.8rem; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.school { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); }
.school > summary { display: flex; flex-wrap: wrap; gap: 0.2rem 0.75rem; align-items: baseline; padding: 0.85rem 1rem; cursor: pointer; }
.school-title { font-weight: 700; }
.school-sub { font-size: 0.875rem; color: var(--muted); }
.school .grid-2 { padding: 0 1rem 1rem; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 0.85rem 1rem; }
@media (min-width: 640px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.wide { grid-column: 1 / -1; }

.moments { display: flex; flex-direction: column; gap: 1.1rem; }
.moments:empty { display: none; }
.row { display: flex; flex-direction: column; gap: 0.5rem; }
.moment-list { padding: 0; list-style: none; display: grid; grid-template-columns: 1fr; gap: 0.7rem; }
@media (min-width: 560px) { .moment-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 960px) { .moment-list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.moment { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 0.25rem; padding: 0.85rem 1rem; text-align: left; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font: inherit; cursor: pointer; }
.moment:hover { border-color: var(--accent); }
.moment-label { font-weight: 700; }
.moment-blurb { font-size: 0.875rem; color: var(--ink-2); }
.moment-count { margin-top: auto; font-size: 0.78rem; font-weight: 600; color: var(--accent); }
.recent { padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.3rem 1.25rem; }

.results-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; }
.count { font-size: 0.85rem; color: var(--muted); }
.text-btn { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.875rem; font-weight: 600; text-decoration: underline; cursor: pointer; }
.cards { padding: 0; list-style: none; display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 768px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.empty { grid-column: 1 / -1; padding: 1.5rem; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--ink-2); }
.card { height: 100%; display: flex; flex-direction: column; gap: 0.55rem; padding: 1.05rem 1.15rem 1.15rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.card-top .meta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.record { padding: 0.05rem 0.5rem; border-radius: 999px; background: var(--warn-soft); color: var(--warn-ink); letter-spacing: 0.08em; }
.star { width: 36px; height: 36px; margin: -6px -6px -6px 0; border: 0; border-radius: 999px; background: none; color: var(--muted); font-size: 1.15rem; cursor: pointer; }
.star:hover, .star[aria-pressed="true"] { color: var(--accent); }
.card h3 { font-size: 1.05rem; line-height: 1.3; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; }
.card-job { font-size: 0.925rem; color: var(--ink-2); }
.card-ready { font-size: 0.82rem; color: var(--muted); }
.card-ready strong { color: var(--ink-2); }
.card-actions { margin-top: auto; padding-top: 0.35rem; display: flex; flex-wrap: wrap; gap: 0.45rem; }
.more { text-align: center; }
.more:empty { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0.45rem 0.9rem; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font: inherit; font-size: 0.875rem; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn.ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.small { min-height: 34px; padding: 0.3rem 0.75rem; }

.crumbs { font-size: 0.875rem; color: var(--muted); }
.ready-grid { display: grid; gap: 1.1rem; }
.ready ul { margin-top: 0.4rem; padding-left: 1.2rem; color: var(--ink-2); }
.ready li + li { margin-top: 0.25rem; }
.ready-meta { color: var(--muted); font-size: 0.9em; }
.step { display: flex; flex-direction: column; gap: 0.8rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.step h2 { display: flex; align-items: center; gap: 0.5rem; }
.num { display: inline-flex; align-items: center; justify-content: center; width: 1.75rem; height: 1.75rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 0.85rem; font-weight: 800; }
.bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.preview > summary { cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--accent); }
.prompt { margin: 0.75rem 0 0; max-height: 28rem; overflow: auto; padding: 1rem; white-space: pre-wrap; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); color: var(--ink-2); font-family: var(--mono); font-size: 0.8125rem; line-height: 1.5; }
.follow { padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }
.follow li { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.follow-label { font-weight: 700; }
.follow-text { margin-top: 0.15rem; font-size: 0.9rem; color: var(--ink-2); }
.related { display: flex; flex-direction: column; gap: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.related ol, .related ul { margin-top: 0.4rem; padding-left: 1.2rem; }
.related li + li { margin-top: 0.2rem; }

.foot { padding-block: 1.5rem 2.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.4rem; }
.foot p:empty { display: none; }
.terms > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.terms section { margin-top: 0.9rem; }
.terms h2 { font-size: 0.95rem; color: var(--ink-2); }
.terms p { margin-top: 0.3rem; max-width: 60rem; }
.terms ul, .terms ol { margin-top: 0.4rem; padding-left: 1.2rem; max-width: 60rem; }
.safety-short { color: var(--ink-2); font-weight: 600; }
@media print {
  .searchbar, .school, .card-actions, .bar, .star { display: none; }
  .prompt { max-height: none; }
}
</style>
</head>

t would they challenge? Which lines rely on something I have not given you? Do not decide the outcome."},"cut-it-by-half":{"label":"Cut it by half","prompt":"Cut the draft to half its length. Keep every decision, date, owner and action. Lose the throat-clearing."},"read-it-as-the-audience":{"label":"Read it as the audience","prompt":"Read your draft as the person who will receive it. What would worry them, confuse them or make them write back? Rewrite those lines and show me what you changed."},"adapt-for-send-and-eal":{"label":"Adapt for SEND and EAL","prompt":"Adapt this for pupils with SEND and pupils new to English, from what I told you about the class. Same objective, more access: scaffolds, vocabulary support, chunked instructions. Do not lower the thinking."},"make-the-thinking-harder":{"label":"Make the thinking harder","prompt":"Add a version for pupils ready for harder thinking. Deeper, not more. Tie it to the same objective."},"quiz-me-on-it":{"label":"Quiz me on it","prompt":"From this, write a five-question retrieval quiz for next lesson and a three-question exit ticket for this one. Answers on a separate block."},"text-message-version":{"label":"Text message version","prompt":"Write a text message version of this under 300 characters, and a two-line version for the school app. Same facts, same date."},"translation-friendly-version":{"label":"Translation-friendly version","prompt":"Rewrite this so a translation tool will handle it well: short sentences, no idioms or school jargon, dates written out in full, one instruction a line."},"what-would-the-board-ask":{"label":"What would the board ask?","prompt":"List the five questions a careful governor or trustee would ask about this, and where the draft already answers them. Mark the gaps."},"one-page-summary":{"label":"One-page summary","prompt":"Give me a one-page version for the board: the decision or ask first, then the three facts that matter, then the risks."}},"search":{"synonyms":{"letter":["letter" eing"]},"stop_words":["to","a","an","the","for","of","and","in","on","my","with","about","i","need","write","help","me"]},"fields":{"school":[{"key":"school","label":"School / trust name","profileKey":"school"},{"key":"phase","label":"Phase and type (maintained, academy, special, AP, sixth form, etc.)","profileKey":"phase"},{"key":"community","label":"Size, community, any designation (Church of England, Catholic, etc.)","profileKey":"community"},{"key":"role","label":"My role","profileKey":"role"}],"job":[{"key":"today","label":"Today's date"},{"key":"audience","label":"Audience for this draft"},{"key":"tone","label":"Tone (plain, formal, warm, firm)","profileKey":"tone"},{"key":"include","label":"Must include"},{"key":"avoid","label":"Must avoid"},{"key":"deadline","label":"When this draft is needed by"},{"key":"facts","label":"Facts, data, notes or source text","multiline":true,"hint":"Paste the notes, data or document the draft should be built from."}],"sets":{"lesson":[{"key":"subject","label":"Subject","profileKey":"subject"},{"key":"years","label":"Year group and class (size, prior attainment, needs; no names)","profileKey":"years"},{"key":"board","label":"Exam board and specification code, if any"},{"key":"time","label":"Lesson length or time available"}],"early-years":[{"key":"age","label":"Age range and setting (nursery, Reception, school-based nursery)"},{"key":"group","label":"Group size and adults"}],"exams":[{"key":"series","label":"Exam series and awarding bodies"}],"governance":[{"key":"board","label":"Board or committee (local governing body, full governing body, trust board, committee)"},{"key":"meeting","label":"Meeting or deadline date"}]}},"preamble":{"start":"You are helping ","end":" in a school in England produce a first draft.\n\nRules you must keep:\n- The school is in England. Use English law, DfE guidance and the Ofsted framework only. Never apply guidance or terms from Wales, Scotland, Northern Ireland, the United States or anywhere else.\n- Write British English with British spelling (organise, behaviour, programme, practise as a verb), and the terms schools in England use: headteacher, Year 4 or Reception, maths, form tutor, break and lunch, dining hall, parents' evening, school trip, supply or cover teacher, educational psychologist, local authority, governors or trustees, term. Never the American ones: principal, fourth grade, kindergarten, math, homeroom, recess, cafeteria, parent-teacher conference, field trip, substitute teacher, school psychologist, school district, school board, semester.\n- Dates as day month year. Keep abbreviations as the user wrote them; only expand one if you are certain what it stands for.\n- This is a draft. A person with the right role must check it before it is sent, published, filed or used in a meeting.\n- Do not invent pupils, staff, data, quotes, inspection grades, legal citations, medical details, costs or evidence. If a fact is missing, ask or write [NEED: ...].\n- Do not commit the school to actions, owners, dates or promises the user did not give. If you suggest any, label them as proposals for the user to decide.\n- Do not pretend to be Ofsted, DfE, a solicitor, a clinician or the school's data protection officer.\n- Only if the job touches safeguarding, HR, exclusions, complaints, FOI/SAR, EHCP or health: say so in one line at the top and keep the draft conservative. Otherwise do not mention it.\n- Prefer short sentences and words a tired colleague can use at 18:30.\n- If the pasted text names pupils, staff or families you do not need to name, use their role or initials instead. Do not assume anyone's gender: use the pronouns given, or \"they\".\n- Use plain headings and short lists, so the draft pastes cleanly into Word or Google Docs.\n- End with: Assumptions you made. What the user still needs to check. What should not be pasted into a public model (names, health, casework).\n\nHow to work:\n1. Read the school context block and everything pasted.\n2. If something essential is missing and no useful draft is possible without it, ask up to five sharp questions and stop. Otherwise write the draft now from what you have, and mark each gap where it falls as [NEED: ...].\n3. Follow the structure under Produce, if there is one.\n4. Before you finish, read the draft once more: change any American spelling or term to the British one (practise is the verb and practice the noun: \"practise your tables\"; term and half term, not semester), and take out anything that applies outside England.\n","stop":"\nSTOP. This job can become a pupil, staff or legal record.\nDo not run it on a public chat. A local model is still not the decision-maker.\nPaste the guidance named in the job, if there is any, and the facts you hold. If the facts are missing, ask. Do not draft the record from guesswork.\n"},"guidance_rule":"Use the edition the user pastes. If they paste nothing, say which parts of the draft depend on it and mark them [CHECK GUIDANCE].","kinds":{"map":{"label":"Scheme or curriculum map","produce":["A short overview: what it covers, for which pupils, over how long. If only part of the specification or curriculum was pasted, build from that part now.","A table by term and half term (autumn 1 and 2, spring 1 and 2, summer 1 and 2) or by week, labelled with the year group: unit, core knowledge, key vocabulary, what it builds on, assessment point.","Why the units are in this order, in three to five sentences.","Where earlier content is retrieved, and when assessment happens.","Risks: lessons that need a specialist, equipment, trips or fixed deadlines."],"check":["Every unit traces to a line in the pasted specification or curriculum. Mark anything you could not trace [CHECK SPEC].","Grammar, vocabulary, texts, studies and practicals come only from what was pasted. Where nothing was pasted, the cell says [CHECK SPEC] instead of a guess.","Each year group's dates and exams are the ones the user gave for that year group.","The teaching time adds up to the time available.","Nothing from another subject, tier, board or key stage has crept in."]},"revision":{"label":"Revision programme","produce":["A dated week-by-week table: focus, class task, home task, retrieval, exam practice. Weeks with no lessons, such as holidays, are shown as such, with optional home tasks only.","A pupil-facing list of topics, left blank for each pupil to rate red, amber or green.","What to drop or shorten if time runs out."],"check":["Every paper and topic the user listed is covered before its exam, with the weakest areas given the most time.","Week dates run Monday to Friday, counted on from the dates the user gave, and nothing is timetabled in a holiday.","Paper titles, lengths, marks and question types only as given; otherwise [CHECK SPEC]. Timed practice allows the time the marks need, roughly a minute a mark unless the user says otherwise.","Case studies, named places and examples only as the user gave them; otherwise [NEED: the case study you taught].","Content comes only from the pasted specification or notes.","Home tasks are short and need no printer, paid resource or specialist adult."]},"lesson":{"label":"Lesson or teaching sequence","produce":["The objective in one sentence, and how the teacher will know it landed.","Prior knowledge to check, with a quick question.","The explanation and modelling, with a worked example where it fits.","Guided practice, then independent practice.","Checks for understanding at named points.","Adaptations for the needs described, as scaffolds within the same task.","Timings for each part."],"check":["The timings add up to the time available.","There is one clear objective, and every activity serves it.","Subject content is accurate and matches what was pasted. Mark anything you are unsure of [CHECK]."]},"resource":{"label":"Classroom resource","produce":["The resource, ready to paste into a document or slide, with a title and pupil instructions.","Answers or a mark scheme on a separate block.","Two lines of teacher notes: when to use it and what to look for."],"check":["Every answer is correct and comes from the pasted content.","The language suits the age and reading level given.","It fits the time available."]},"feedback":{"label":"Feedback, comments or marking","produce":["What was done well, tied to the criteria or evidence.","The most important next step, phrased so the reader can act on it.","For a group: common strengths, the main misconceptions, and a reteach or next task."],"check":["Every judgement points to something in the work, notes or criteria pasted.","No mark, grade or level the evidence does not support.","No comment generic enough to fit anyone."]},"message":{"label":"Letter, email or message","produce":["A subject line or heading.","The point in the first two sentences, then the detail.","Exactly what the reader should do, and by when.","Placeholders for anything not supplied, such as [phone] or [date]."],"check":["If it goes to families, a parent with a reading age of 9 to 11 can follow it, with no jargon or acronyms.","Dates, days and times agree with each other.","The tone asked for, and nothing that identifies another child or family."]},"copy":{"label":"Published or public text","produce":["The text at the length asked, opening with what the reader most needs to know.","Headings and short paragraphs where it will be read on a screen."],"check":["Every claim is backed by something the user supplied.","It sounds like this school, using its own words, with no stock phrases.","Nothing in it identifies a pupil without consent."]},"paper":{"label":"Board, committee or decision paper","produce":["At the top: the purpose, and the decision or discussion needed.","A summary of no more than five lines.","The evidence and context, with every figure from the pasted material.","The options, each with benefits, risks and cost where known.","A recommendation only if one was asked for, and the questions the board should ask."],"check":["Facts and judgements are kept apart.","It does not take a decision that belongs to the board, panel or head.","Every figure is traceable to what was pasted."]},"plan":{"label":"Plan","produce":["Three to five priorities, each with why it matters here.","A table: action, owner (by role), start and end dates, cost or time, success measure, how and when it is checked.","What will stop or shrink to make room."],"check":["Success measures can be observed or counted, not just \"improve\".","Owners are roles the school has, and dates fit the capacity described.","Nothing in it relies on data, funding or staff that were not mentioned."]},"policy":{"label":"Policy, procedure or formal document","produce":["Purpose, scope and who it applies to.","Roles and responsibilities.","The procedure as numbered steps.","If it relies on statutory guidance: name it, and mark each point [CHECK GUIDANCE] unless the user pasted the current wording.","Review date and owner, as given, or [NEED: review date]."],"check":["Every time, code, threshold and rule the user gave is in it.","It describes what this school actually does, not a generic model.","No legal requirement is stated as fact unless it came from the pasted guidance.","It is short enough for staff to follow."]},"record":{"label":"Record or factual note","produce":["Who wrote it, for whom, and the date. If it records an event: when, where and who was there, as given.","What happened or what is known, in order, with exact words in quotation marks where given.","Actions already taken, and who was told and when, only as given in the notes.","Next steps and owners as given. Any other next step is marked as a proposal, with no invented date."],"check":["Every sentence is fact, not opinion or speculation.","No diagnosis, motive, finding or conclusion is added.","No meeting, action, person or date appears that was not in the notes. Gaps are marked [NEED: ...] only where the reader needs them."]},"people":{"label":"Staff or HR document","produce":["The structure the school's policy uses, or a clear one if none was given.","Each judgement linked to an objective, standard or piece of evidence.","Support offered, next steps and dates."],"check":["It is fair, specific and could be read by the person, a union representative or a tribunal without surprise.","It follows the policy pasted and does not decide anything HR or the panel must decide.","Nothing about health, family or protected characteristics beyond what was supplied and needed."]},"brief":{"label":"Briefing, checklist or run sheet","produce":["One page or less.","Numbered steps or a timed run sheet: who, what, when, where.","Who to contact, and what to do if something goes wrong."],"check":["Every time, name, code and rule the user gave is in it.","Someone new to the task could follow it alone.","Names, times and places agree throughout.","Nothing important is buried in a paragraph."]},"analysis":{"label":"Analysis or summary","produce":["The three to five things that matter most, first.","The evidence for each: a figure or a quoted line from what was pasted.","The questions it raises, and what the material cannot tell you."],"check":["Every number and quotation is traceable to the pasted material.","Small groups and one-off figures are flagged rather than over-read.","No national or external comparison that was not supplied."]},"evaluation":{"label":"Self-evaluation or evidence review","produce":["For each area: what the evidence shows, the evidence itself, and what is thin or missing.","Strengths and next steps, in plain language.","The evidence still to gather, and who could gather it."],"check":["Every claim is matched to a piece of evidence that was supplied.","No predicted inspection grade or judgement wording the user did not ask for.","Thin areas are named honestly."]},"support":{"label":"Support plan for a pupil or group","produce":["Strengths and interests, then needs, from what was given.","Outcomes that can be checked at the review: the plan's own wording where there is a plan, otherwise new outcomes marked as proposals.","Provision: what, who, how often, where.","The pupil's and family's views, in their words where given.","Review date and who reviews it, as given, or [NEED: review date]."],"check":["No diagnosis, label or medical detail that was not supplied.","No target, figure or date that was not supplied, unless it is clearly marked as a proposal.","The pupil is referred to by initials and the pronouns given, or \"they\".","The provision is something this school can staff.","It is written so the pupil and family could read it."]},"conversation":{"label":"Plan for a conversation","produce":["The purpose, in one sentence.","An opening line.","The facts to share, and the questions to ask.","Likely responses, and calm ways to answer them.","How to close with one agreed next step, and how it is recorded."],"check":["It is curious rather than blaming, and sticks to facts.","It leaves room for the other person to be heard.","It follows any policy pasted, and does not promise what the school cannot give."]},"profile":{"label":"Pupil profile or pen portrait","produce":["A few lines on who the pupil is: strengths, interests and what they enjoy.","Their needs, in plain words staff can act on.","What helps, and what to avoid.","The pupil's own words, quoted exactly, where given.","A key-need summary of two or three sentences."],"check":["Everything comes from the plan or notes pasted. No targets, outcomes, provision or dates that were not given.","No diagnosis, need category or label beyond what the plan states.","The pupil is referred to by initials and the pronouns given, or \"they\".","A member of staff could read it in two minutes."]},"observation":{"label":"Early years observation or note","produce":["What the child did and said, as observed.","What it shows about their learning in the area named.","The next step, and how adults will offer it in provision."],"check":["Only what was seen or heard. No invented development bands, ages or diagnoses.","Warm, specific and readable by the family."]},"risk":{"label":"Risk assessment","produce":["A table: hazard, who might be harmed and how, existing controls, further action, owner, by when, remaining risk.","Emergency arrangements and contacts.","Review date."],"check":["Hazards are specific to this activity, site and group.","No invented codes, quantities, chemicals or medical protocols.","Remaining risk uses the school's own scale, or is left for the school to rate."]},"script":{"label":"Script or talk","produce":["A script that can be read aloud in the time given, with rough timings.","A strong opening, one main idea, and a clear close.","Points for questions or interaction, if they fit."],"check":["It fits the time at about 130 spoken words a minute.","It suits the age and audience.","Nothing in it singles out a pupil or family."]},"coach":{"label":"Thinking partner","produce":["Ask one question at a time and wait for the answer.","Reflect back what you heard in a sentence before moving on.","End with a short summary: what was decided, the next step, and when to come back to it."],"check":["The user's goal and voice stay theirs.","Nothing is offered as medical, legal or professional advice."]}},"terms":{"updated":"22 October 2026","summary":"School Prompts is free, provided as is, with no warranty and no support. It is not professional advice. Your school decides whether and how to use it, is responsible for that use and for every draft, and accepts the risk. To the fullest extent the law allows, Joshua Mangas accepts no liability.","sections":[{"heading":"Who this is from, and agreeing to these terms","body":["School Prompts is a free set of prompt templates and a static web page, made available by Joshua Mangas free of charge under the Creative Commons Attribution 4.0 International licence (CC BY 4.0).","By using, downloading, installing or sharing School Prompts, you agree to these terms. If you do so for prompt cannot control what an AI tool produces. Output can be wrong, incomplete, out of date, biased, inappropriate or invented. Joshua Mangas does not provide, operate or control any AI tool and is not responsible for any tool, its output, its availability, or how its provider handles your data. Your use of any AI tool is governed by your agreement with its provider."]},{"heading":"5. Installing it on your systems","body":["If you download School Prompts or install it on your own systems, you are responsible for reviewing the files before use, and for hosting, configuring, securing, maintaining, updating and removing them, and for any settings or prompts you add."]},{"heading":"6. No support and no guarantee of availability","body":["There is no obligation to provide support, maintenance, updates or fixes, to answer questions, or to keep this website, the files or any download available. Any of them may change or be withdrawn at any time without notice."]},{"heading":"7. Limitation of liability","body":["To the fullest extent permitted by law, Joshua Mangas will not be liable to you or anyone else for any loss, damage, cost or claim of any kind, whether direct, indirect or consequential, and whether arising in contract, tort (including negligence), breach of statutory duty or otherwise, arising out of or in connection with School Prompts, its use or inability to use it, or any output produced with it. This includes, without limitation, loss of or damage to data, loss of profit, revenue or savings, regulatory fines or penalties, reputational harm, and claims by pupils, parents, staff or other third parties.","You agree to use School Prompts at your own risk, and to indemnify Joshua Mangas against any claim brought by a third party arising from your use of it or of any output produced with it."]},{"heading":"8. What these terms do not exclude","body":["Nothing in these terms excludes or limits any liability that cannot be excluded or limited under the law of England and Wales, such as liability for death or personal injury caused by negligence, or for fraud or fraudulent misrepresentation."]},{"heading":"9. The licence","body":["The prompt text is licensed under CC BY 4.0, including its Section 5 disclaimer of warranties and limitation of liability, which applies alongside these terms. You may use, adapt and share it if you keep the credit: School Prompts by Joshua Mangas."]},{"heading":"10. Not affiliated","body":["School Prompts is independent. It is not connected with or endorsed by the Department for Education, Ofsted, any awarding body, local authority or diocese, or any AI provider. Product names are used only to describe where the library can run, and belong to their owners."]},{"heading":"11. General","body":["If any part of these terms is found unenforceable, the rest still applies. These terms may be updated at any time; the version on this page applies from the date shown. These terms are governed by the law of England and Wales, and the courts of England and Wales have exclusive jurisdiction."]}]},"safety":{"updated":"22 October 2026","lead":"A straight answer for staff, leaders and data protection officers in schools in England.","short":"School Prompts is reliable as a quick way to get a well-structured first draft. It is not reliable as a source of facts, figures or legal requirements, and it never makes a decision. A person with the right role checks every draft before it is used. Every prompt says so.","sections":[{"heading":"What it is reliable for","items":["Drafts built from what you give it: a letter or newsletter from your facts, a summary of a paper you paste, a survey write-up from your figures, a classroom resource from your content, notes and procedures from your notes.","A consistent shape. Every job sets out what the draft must contain and the checks the model runs before it hands it over.","Marking gaps instead of guessing. Missing facts come back as [NEED: ...], and anything that depends on guidance you did not paste comes back as [CHECK GUIDANCE] or [CHECK SPEC].","Flagging the jobs that can become a pupil, staff or legal record, so they stay in a tool your school controls."]},{"heading":"What it is not reliable for","intro":"Check these yourself, every time:","items":["Facts the model has to remember: statutory deadlines, attendance codes, exam specifications, dates and weekdays, case studies.","Figures. A model can invent a number even when told not to, and asking it to check its own work does not reliably catch it. Check every figure against your source.","Names, owners, dates and promises the school has not agreed.","Decisions. It never decides an exclusion, a safeguarding referral, a capability outcome or a grade. The person who owns that decision does."]},{"heading":"How it was tested","items":["Jobs drawn at random from every shelf were filled in for two fictional schools and run on a small, free model on an ordinary desktop computer, with nothing sent anywhere. That is a harder test than the larger tools most schools use.","Each draft was read against what its own prompt asked for, and every fault was traced to its cause. Faults in the prompts were fixed and the jobs run again, forty drafts in all.","After the fixes every draft was usable, most after some editing, and none needed starting again. The errors that remained are the ones listed above, which is why the rules below exist.","The guidance named in the prompts was checked against published sources on 20 October 2026. Each job links to the publisher's page, so you always fetch the current edition."]},{"heading":"Use it safely","numbered":true,"items":["Use the AI tool your school has approved, for the purposes it approved. Public chats are only for work with no personal data in it.","Run jobs marked Record only in that approved tool. The person who owns the record decides what it says.","Paste the source: the guidance named on the job, the specification, your notes or data. A draft is only as good as what you give it.","Keep names out where you can. Initials and roles are enough for a draft.","Resolve every [NEED] and [CHECK] mark before the draft goes anywhere.","Check every figure, date, name and rule against your source yourself.","A person with the right role reads and signs off the draft before it is sent, published, filed or used in a meeting."]},{"heading":"Signs a draft is not ready","items":["It states a deadline, code or rule you did not paste.","It contains a figure you cannot find in your source.","It names a person, owner or date nobody agreed.","It uses American terms, or refers to the rules in Wales, Scotland or Northern Ireland.","It decides something a person must decide."]},{"heading":"For leaders and data protection officers","intro":"Before staff use it:","items":["Decide which AI tool staff may use and for what, and whether that tool needs a data protection impact assessment.","Decide where Record jobs may be run, and tell your DSL and HR lead.","Give staff the seven rules above. They take two minutes to read.","Review it once a year. Statutory guidance changes, most years in September."],"outro":"School Prompts is free, provided as is, with no warranty and no support. Your school decides whether and how to use it."}]},"guidance_checked":"20 October 2026"};

<script>
/* School Prompts: builds a prompt from a job, the school profile and this job's answers.
   Plain script, no modules, so the library also runs from a shared drive. */
(function (root) {
  "use strict";
  var D = root.FSAI_DATA;

  function preamble(role, gate) {
    return D.preamble.start + role + D.preamble.end + (gate ? D.preamble.stop : "");
  }

  function fieldsFor(job) {
    return {
      school: D.fields.school,
      extra: (job.fields && D.fields.sets[job.fields]) || [],
      job: D.fields.job,
    };
  }

  function valueFor(field, profile, answers) {
    var own = answers[field.key];
    if (own !== undefined && String(own).trim() !== "") return String(own).trim();
    if (field.profileKey && profile[field.profileKey]) return String(profile[field.profileKey]).trim();
    return "";
  }

  function contextBlock(job, profile, answers) {
    var f = fieldsFor(job);
    var all = f.school.concat(f.extra, f.job);
    var lines = all.map(function (field) {
      var value = valueFor(field, profile, answers);
      if (!value) return "- " + field.label + ":";
      return field.multiline || value.indexOf("\n") !== -1
        ? "- " + field.label + ":\n" + value
        : "- " + field.label + ": " + value;
    });
    return "\nSCHOOL CONTEXT (paste what you have, delete the rest)\n" + lines.join("\n") + "\n\nNow do the job.\n";
  }

  function bullets(lines) {
    return lines.map(function (l) { return "- " + l; }).join("\n");
  }

  /* What the draft must contain and the checks to run, from the job's kind. */
  function standard(job) {
    var kind = job.kind && D.kinds[job.kind];
    if (!kind) return "";
    return "\nProduce:\n" + bullets(kind.produce) + "\n\nBefore you hand it over, check these and fix anything that fails (do not copy this list into the draft):\n" + bullets(kind.check) + "\n";
  }

  function buildPrompt(job, profile, answers) {
    profile = profile || {};
    answers = answers || {};
    var guidance = job.guidance && job.guidance.length
      ? "\nGuidance the user should paste before you draft:\n" + bullets(job.guidance) + "\n" + D.guidance_rule + "\n"
      : "";
    return (
      preamble(job.role, job.gate) +
      guidance +
      "\nJob: " + job.name + "\n\nWhat good looks like:\n" + job.job + "\n" +
      standard(job) +
      contextBlock(job, profile, answers)
    );
  }

  function stem(word) {
    if (word.length > 4 && /ies$/.test(word)) return word.slice(0, -3) + "y";
    if (word.length > 3 && /s$/.test(word) && !/ss$/.test(word)) return word.slice(0, -1);
    return word;
  }

  /** Every typed word (or one of its synonyms) must match; names outrank descriptions. */
  function search(jobs, query) {
    var stop = D.search.stop_words;
    var words = String(query || "")
      .toLowerCase()
      .replace(/[^a-z0-9À-ɏ\s'-]/g, " ")
      .split(/\s+/)
      .filter(function (w) { return w.length > 1 && stop.indexOf(w) === -1; })
      .map(stem);
    if (!words.length) return jobs;
    var scored = [];
    jobs.forEach(function (job) {
      var name = job.name.toLowerCase();
      var text = job.job.toLowerCase();
      var cat = (job.category + " " + job.role).toLowerCase();
      var score = 0;
      for (var i = 0; i < words.length; i++) {
        var word = words[i];
        var forms = [word].concat(D.search.synonyms[word] || []);
        var best = 0;
        forms.forEach(function (f) {
          var weight = f === word ? 1 : 0.7;
          if (name.indexOf(f) !== -1) best = Math.max(best, (name.indexOf(f) === 0 ? 12 : 8) * weight);
          else if (cat.indexOf(f) !== -1) best = Math.max(best, 4 * weight);
          else if (text.indexOf(f) !== -1) best = Math.max(best, 2 * weight);
        });
        if (!best) return;
        score += best;
      }
      scored.push({ job: job, score: score });
    });
    scored.sort(function (a, b) { return b.score - a.score || (a.job.id < b.job.id ? -1 : 1); });
    return scored.map(function (s) { return s.job; });
  }

  root.FSAI = { buildPrompt: buildPrompt, fieldsFor: fieldsFor, search: search, kinds: D.kinds };
})(typeof window !== "undefined" ? window : this);
</script>

/* School Prompts library for a school intranet.
   No server, no network calls, no cookies. Staff details live in this browser's
   localStorage only. Everything is built with DOM calls, never innerHTML. */
(function () {
  "use strict";

  var D = window.FSAI_DATA;
  var F = window.FSAI;
  var C = window.FSAI_CONFIG || {};
  var app = document.getElementById("app");
  var announcer = document.getElementById("announce");
  var TITLE = C.title || "Prompt library";
  var PAGE = 24;
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DEFAULT_FOLLOW_UPS = ["show-where-every-figure-came-from", "cut-it-by-half", "read-it-as-the-audience"];

  /* ---------- storage ---------- */
  var KEY = "fsai:intranet:";
  function load(name, fallback) {
    try {
      var raw = window.localStorage.getItem(KEY + name);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function save(name, value) {
    try {
      window.localStorage.setItem(KEY + name, JSON.stringify(value));
    } catch (e) {
      /* Not saved; the page still works for this visit. */
    }
  }

  /* ---------- the school profile ---------- */
  var CONFIG_SCHOOL = C.school || {};
  var PROFILE_KEYS = ["school", "phase", "community", "role", "tone", "subject", "years"];
  var SCHOOL_KEYS = ["school", "phase", "community", "tone"];
  var PROFILE_FIELDS = [
    { key: "school", label: "School or trust", placeholder: "Samplefold Community Primary School" },
    { key: "phase", label: "Phase and type", placeholder: "Maintained primary, ages 3 to 11" },
    { key: "community", label: "Size, community, designation", placeholder: "312 on roll, rural, Church of England" },
    { key: "tone", label: "House tone", placeholder: "Warm and plain" },
    { key: "role", label: "Your role", placeholder: "Year 4 teacher and English lead" },
    { key: "subject", label: "Subjects you teach", placeholder: "English, history" },
    { key: "years", label: "Usual year groups or classes", placeholder: "Year 4, mixed ability, 28 pupils" },
  ];

  function locked(key) {
    return Boolean(C.lockSchool && SCHOOL_KEYS.indexOf(key) !== -1 && CONFIG_SCHOOL[key]);
  }

  function profile() {
    var mine = load("profile", {});
    var out = {};
    PROFILE_KEYS.forEach(function (k) {
      var fromConfig = typeof CONFIG_SCHOOL[k] === "string" ? CONFIG_SCHOOL[k] : "";
      var own = mine && typeof mine[k] === "string" ? mine[k] : "";
      out[k] = locked(k) ? fromConfig : own || fromConfig;
    });
    return out;
  }

  function setProfile(key, value) {
    var mine = load("profile", {}) || {};
    mine[key] = String(value).slice(0, 400);
    save("profile", mine);
  }

  /* ---------- jobs ---------- */
  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function strings(list) {
    return Array.isArray(list) ? list.filter(function (x) { return typeof x === "string" && x.trim(); }) : [];
  }

  var custom = (Array.isArray(C.customJobs) ? C.customJobs : [])
    .filter(function (j) { return j && typeof j.name === "string" && typeof j.job === "string" && j.name.trim() && j.job.trim(); })
    .map(function (j, i) {
      var guidance = strings(j.guidance);
      return {
        id: "S" + String(i + 1).padStart(2, "0"),
        slug: "our-" + slugify(j.name) + "-" + (i + 1),
        name: j.name.trim(),
        category: "Our school",
        role: typeof j.role === "string" && j.role.trim() ? j.role.trim() : "a member of school staff",
        gate: j.gate === true,
        guidance: guidance,
        have_ready: guidance,
        job: j.job.trim(),
        fields: typeof j.fields === "string" ? j.fields : "",
        kind: typeof j.kind === "string" && D.kinds[j.kind] ? j.kind : "",
        guidance_links: [],
        follow_ups: DEFAULT_FOLLOW_UPS,
      };
    });

  var hidden = strings(C.hideCategories);
  var JOBS = custom.concat(
    D.jobs.filter(function (j) {
      if (C.hideRecordJobs && j.gate) return false;
      return hidden.indexOf(j.category) === -1;
    })
  );
  var BY_SLUG = {};
  JOBS.forEach(function (j) { BY_SLUG[j.slug] = j; });

  var SHELVES = (custom.length ? [{ id: "ours", label: "Our school", categories: ["Our school"] }] : []).concat(
    D.shelves
      .map(function (s) {
        return { id: s.id, label: s.label, categories: s.categories.filter(function (c) { return hidden.indexOf(c) === -1; }) };
      })
      .filter(function (s) { return s.categories.length; })
  );
  var MOMENTS = D.moments
    .map(function (m) {
      return { id: m.id, label: m.label, blurb: m.blurb, months: m.months, slugs: m.slugs.filter(function (s) { return BY_SLUG[s]; }) };
    })
    .filter(function (m) { return m.slugs.length >= 3; });

  function jobsFor(slugs) {
    return slugs.map(function (s) { return BY_SLUG[s]; }).filter(Boolean);
  }

  /* ---------- small DOM helpers ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k === "value") el.value = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) child.forEach(function (c) { add(el, c); });
    else el.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }
  function announce(msg) {
    announcer.textContent = "";
    window.setTimeout(function () { announcer.textContent = msg; }, 30);
  }

  function copyText(text) {
    function fallback() {
      try {
        var area = h("textarea", { readonly: true, class: "offscreen" });
        area.value = text;
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(area);
        return Promise.resolve(ok);
      } catch (e) {
        return Promise.resolve(false);
      }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  function flash(button, ok, idle) {
    button.textContent = ok ? "Copied" : "Copy failed";
    announce(ok ? "Copied." : "Copy failed. Open the job and select the prompt by hand.");
    window.setTimeout(function () { button.textContent = idle; }, 1800);
  }

  function download(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    var a = h("a", { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function todayLabel() {
    return new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }

  function jobLink(slug) {
    return window.location.href.split("#")[0] + "#/job/" + slug;
  }

  function starred() {
    return strings(load("starred", []));
  }
  function toggleStar(slug) {
    var now = starred();
    save("starred", now.indexOf(slug) === -1 ? [slug].concat(now) : now.filter(function (s) { return s !== slug; }));
  }
  function noteCopied(slug) {
    save("recent", [slug].concat(strings(load("recent", [])).filter(function (s) { return s !== slug; })).slice(0, 8));
  }

  /* ---------- routing ---------- */
  function route() {
    var hash = window.location.hash || "";
    var m = hash.match(/^#\/job\/([a-z0-9-]+)/);
    if (m && BY_SLUG[m[1]]) return renderJob(BY_SLUG[m[1]]);
    var qs = hash.indexOf("?") !== -1 ? hash.slice(hash.indexOf("?") + 1) : "";
    renderList(new URLSearchParams(qs));
  }

  function setListState(state) {
    var p = new URLSearchParams();
    Object.keys(state).forEach(function (k) { if (state[k]) p.set(k, state[k]); });
    var q = p.toString();
    window.history.replaceState(null, "", "#/" + (q ? "?" + q : ""));
  }

  /* ---------- shared pieces ---------- */
  function advice(text, kind) {
    return text ? h("div", { class: "callout" + (kind ? " " + kind : ""), role: "note" }, h("p", { text: text })) : null;
  }

  function profileForm() {
    var p = profile();
    var anySet = PROFILE_KEYS.some(function (k) { return p[k]; });
    var grid = h("div", { class: "grid-2" });
    PROFILE_FIELDS.forEach(function (f) {
      var id = "profile-" + f.key;
      var isLocked = locked(f.key);
      grid.appendChild(
        h(
          "label",
          { class: "field", for: id },
          h("span", { text: f.label + (isLocked ? " (set by school)" : "") }),
          h("input", {
            id: id,
            class: "input",
            value: p[f.key],
            placeholder: f.placeholder,
            autocomplete: "off",
            readonly: isLocked,
            oninput: function (e) {
              setProfile(f.key, e.target.value);
              document.dispatchEvent(new Event("fsai:profile"));
            },
          })
        )
      );
    });
    grid.appendChild(h("p", { class: "note wide", text: "Saved in this browser only. Nothing is sent anywhere. No pupil or staff names here." }));
    return h(
      "details",
      { class: "school", open: !anySet },
      h(
        "summary",
        null,
        h("span", { class: "school-title", text: p.school ? "Using " + p.school : "Fill in your details once" }),
        h("span", { class: "school-sub", text: anySet ? "Every prompt starts with these. Open to edit." : "Then every prompt you copy starts filled in." })
      ),
      grid
    );
  }

  /* ---------- the list ---------- */
  function renderList(params) {
    document.title = TITLE;
    var state = {
      q: params.get("q") || "",
      shelf: params.get("shelf") || "",
      c: params.get("c") || "",
      m: params.get("m") || "",
      view: params.get("view") || "",
    };
    var shown = PAGE;
    clear(app);

    var search = h("input", {
      id: "search",
      type: "search",
      class: "input search",
      value: state.q,
      placeholder: "Try: letter to parents, exit ticket, EHCP review",
      autocomplete: "off",
      oninput: function (e) {
        state.q = e.target.value;
        shown = PAGE;
        update();
      },
    });
    var chips = h("div", { class: "chips", role: "group", "aria-label": "Shelves" });
    var subChips = h("div", { class: "chips sub", role: "group", "aria-label": "Categories" });
    var moments = h("div", { class: "moments" });
    var head = h("div", { class: "results-head" });
    var grid = h("ul", { class: "cards" });
    var more = h("p", { class: "more" });

    add(app, [
      h("h1", { text: TITLE }),
      C.intro ? h("p", { class: "lead", text: C.intro }) : null,
      advice(C.modelAdvice),
      h("div", { class: "searchbar" }, h("label", { for: "search", class: "search-label", text: "What do you need to write?" }), search, chips, subChips),
      profileForm(),
      moments,
      head,
      grid,
      more,
    ]);

    function chip(label, pressed, onclick, small) {
      return h("button", { type: "button", class: "chip" + (small ? " small" : ""), "aria-pressed": pressed ? "true" : "false", onclick: onclick, text: label });
    }

    function pick(next) {
      Object.keys(next).forEach(function (k) { state[k] = next[k]; });
      shown = PAGE;
      update();
    }

    function update() {
      setListState(state);
      var stars = starred();
      var shelf = SHELVES.filter(function (s) { return s.id === state.shelf; })[0];
      var moment = MOMENTS.filter(function (m) { return m.id === state.m; })[0];
      var browsing = !state.q && !state.shelf && !state.c && !state.m && !state.view;

      clear(chips);
      add(chips, chip("All " + JOBS.length, browsing, function () { pick({ q: "", shelf: "", c: "", m: "", view: "" }); search.value = ""; }));
      SHELVES.forEach(function (s) {
        add(chips, chip(s.label, state.shelf === s.id && !state.m && !state.view, function () {
          pick({ shelf: state.shelf === s.id ? "" : s.id, c: "", m: "", view: "" });
        }));
      });
      if (stars.length) add(chips, chip("Starred " + stars.length, state.view === "starred", function () { pick({ view: state.view === "starred" ? "" : "starred", shelf: "", c: "", m: "" }); }));

      clear(subChips);
      if (shelf && shelf.categories.length > 1) {
        shelf.categories.forEach(function (c) {
          add(subChips, chip(c, state.c === c, function () { pick({ c: state.c === c ? "" : c }); }, true));
        });
      }

      clear(moments);
      if (browsing) {
        var recent = jobsFor(strings(load("recent", []))).slice(0, 4);
        if (recent.length) {
          add(moments, h("div", { class: "row" }, h("p", { class: "meta", text: "You copied recently" }),
            h("ul", { class: "recent" }, recent.map(function (j) { return h("li", null, h("a", { href: "#/job/" + j.slug, text: j.name })); }))));
        }
        var month = new Date().getMonth() + 1;
        var now = MOMENTS.filter(function (m) { return m.months.indexOf(month) !== -1; });
        var always = MOMENTS.filter(function (m) { return !m.months.length; });
        if (now.length) add(moments, momentRow("Right now, in " + MONTHS[month - 1], now));
        if (always.length) add(moments, momentRow("Any day", always));
      }

      var list;
      if (state.view === "starred") list = jobsFor(stars);
      else if (moment) list = jobsFor(moment.slugs);
      else {
        list = JOBS;
        if (shelf) list = list.filter(function (j) { return shelf.categories.indexOf(j.category) !== -1; });
        if (state.c) list = list.filter(function (j) { return j.category === state.c; });
      }
      if (state.q) list = F.search(list, state.q);

      clear(head);
      var title = state.view === "starred" ? "Your starred jobs" : moment ? moment.label : state.c || (shelf ? shelf.label : "Every job");
      add(head, [
        h("h2", { text: title }),
        h("p", { class: "count", text: list.length + (list.length === 1 ? " job" : " jobs") + (state.q ? ' for "' + state.q + '"' : "") + (moment ? ". " + moment.blurb : "") }),
        browsing ? null : h("button", { type: "button", class: "text-btn", text: "Clear filters", onclick: function () { search.value = ""; pick({ q: "", shelf: "", c: "", m: "", view: "" }); } }),
      ]);

      clear(grid);
      if (!list.length) {
        add(grid, h("li", { class: "empty" }, "Nothing matched. Try a shorter word, or use ",
          BY_SLUG["write-me-a-prompt"] ? h("a", { href: "#/job/write-me-a-prompt", text: "Write me a prompt for a job not here" }) : "a different word", "."));
      }
      list.slice(0, shown).forEach(function (j) { add(grid, h("li", null, card(j, stars.indexOf(j.slug) !== -1, update))); });

      clear(more);
      if (shown < list.length) {
        add(more, h("button", { type: "button", class: "btn ghost", text: "Show more (" + (list.length - shown) + " left)", onclick: function () { shown += PAGE * 2; update(); } }));
      }
    }

    function momentRow(label, list) {
      return h("div", { class: "row" }, h("p", { class: "meta", text: label }),
        h("ul", { class: "moment-list" }, list.map(function (m) {
          return h("li", null, h("button", { type: "button", class: "moment", onclick: function () { search.value = ""; pick({ m: m.id, q: "", shelf: "", c: "", view: "" }); } },
            h("span", { class: "moment-label", text: m.label }),
            h("span", { class: "moment-blurb", text: m.blurb }),
            h("span", { class: "moment-count", text: m.slugs.length + " jobs" })));
        })));
    }

    document.addEventListener("fsai:profile", onProfile);
    function onProfile() {
      if (!document.body.contains(grid)) return document.removeEventListener("fsai:profile", onProfile);
      update();
    }

    update();
  }

  function card(job, isStarred, refresh) {
    var copyBtn = h("button", { type: "button", class: "btn", text: "Copy prompt" });
    copyBtn.addEventListener("click", function () {
      copyText(F.buildPrompt(job, profile(), { today: todayLabel() })).then(function (ok) {
        if (ok) noteCopied(job.slug);
        flash(copyBtn, ok, "Copy prompt");
      });
    });
    var linkBtn = h("button", { type: "button", class: "btn ghost", text: "Copy link" });
    linkBtn.addEventListener("click", function () {
      copyText(jobLink(job.slug)).then(function (ok) { flash(linkBtn, ok, "Copy link"); });
    });
    return h("article", { class: "card" },
      h("div", { class: "card-top" },
        h("p", { class: "meta accent" }, job.category, job.gate ? h("span", { class: "record", text: "Record" }) : null),
        h("button", {
          type: "button",
          class: "star",

      h("h3", null, h("a", { href: "#/job/" + job.slug, text: job.name })),

      h("div", { class: "card-actions" }, copyBtn, h("a", { class: "btn ghost", href: "#/job/" + job.slug, text: "Fill in first" }), linkBtn));
  }

  /* ---------- one job ---------- */
  function renderJob(job) {

    var answers = { today: todayLabel() };
    var f = F.fieldsFor(job);
    var pre = h("pre", { class: "prompt", tabindex: "0" });

      input.addEventListener("input", function () { answers[field.key] = input.value; refresh(); });
      add(fields, h("label", { class: "field" + (field.multiline ? " wide" : ""), for: id }, h("span", { text: field.label }), input));
    });

    var copyBtn = h("button", { type: "button", class: "btn", text: "Copy the prompt" });
    copyBtn.addEventListener("click", function () {
      copyText(refresh()).then(function (ok) {
        if (ok) noteCopied(job.slug);
        flash(copyBtn, ok, "Copy the prompt");
      });
    });
    var linkBtn = h("button", { type: "button", class: "btn ghost", text: "Copy link" });
    linkBtn.addEventListener("click", function () { copyText(jobLink(job.slug)).then(function (ok) { flash(linkBtn, ok, "Copy link"); }); });
    var isStarred = starred().indexOf(job.slug) !== -1;
    var starBtn = h("button", { type: "button", class: "btn ghost", "aria-pressed": isStarred ? "true" : "false", text: isStarred ? "★ Starred" : "☆ Star" });

    var followUps = (job.follow_ups || DEFAULT_FOLLOW_UPS).map(function (id) { return D.follow_ups[id]; }).filter(Boolean);
    var moments = MOMENTS.filter(function (m) { return m.slugs.indexOf(job.slug) !== -1; });
    var inMoments = {};
    moments.forEach(function (m) { m.slugs.forEach(function (s) { inMoments[s] = true; }); });
    var nearby = JOBS.filter(function (j) { return j.category === job.category && j.slug !== job.slug && !inMoments[j.slug]; }).slice(0, 6);

    var h1 = h("h1", { tabindex: "-1", text: job.name });
    add(app, [
      h("p", { class: "crumbs" }, h("a", { href: "#/", text: "← All jobs" }), " · " + job.category + " · Job " + job.id),
      h1,
      h("p", { class: "lead", text: job.job }),
      job.gate

            h("p", { class: "callout-title", text: "This job can become a record" }),
            h("p", { text: C.recordAdvice || "It can end up as a pupil, staff or legal record. Never paste it into a public chat. Use the tool your school has approved, keep names out where you can, and let the person who owns the record decide." }))
        : advice(C.modelAdvice),
      h("div", { class: "ready-grid" },
        h("div", { class: "ready" }, h("p", { class: "meta", text: "Have this ready" }),
          job.guidance_links && job.guidance_links.length && D.guidance_checked
            ? h("p", { class: "note", text: "Guidance checked " + D.guidance_checked + ". Each link opens the current edition." })
            : null,
          h("ul", null,

                })
              : (job.guidance || []).map(function (g) { return h("li", { text: g }); })),
            h("li", { text: "Your own notes, data or the document the draft should be built from." }))),
        job.kind && D.kinds[job.kind]
          ? h("div", { class: "ready" }, h("p", { class: "meta", text: "What you will get: " + D.kinds[job.kind].label.toLowerCase() }),
              h("ul", null, D.kinds[job.kind].produce.map(function (l) { return h("li", { text: l }); })))
          : null),
      step(1, "Your details", profileForm()),
      step(2, "This job", [

      ]),
      followUps.length
        ? step(4, "When the draft comes back", [

            h("ul", { class: "follow" }, followUps.map(function (fu) {

            })));
        }),
        nearby.length ? h("div", null, h("p", { class: "meta", text: "More in " + job.category }),
          h("ul", null, nearby.map(function (j) { return h("li", null, h("a", { href: "#/job/" + j.slug, text: j.name })); }))) : null),
    ]);

    document.addEventListener("fsai:profile", onProfile);
    function onProfile() {
      if (!document.body.contains(pre)) return document.removeEventListener("fsai:profile", onProfile);
      refresh();
    }
    refresh();
    window.scrollTo(0, 0);
    h1.focus();
  }

  function step(n, title, body) {
    return h("section", { class: "step" }, h("h2", null, h("span", { class: "num", text: String(n) }), " " + title), body);
  }

  /* ---------- start ---------- */
  var foot = document.getElementById("foot-contact");
  if (C.contact && foot) foot.textContent = C.contact;
  var safetyEl = document.getElementById("foot-safety");
  if (safetyEl && D.safety) {
    add(safetyEl, h("details", { class: "terms" },
      h("summary", { text: "Using it safely: how reliable it is, and seven rules for staff" }),
      h("p", { class: "safety-short", text: D.safety.short }),
      D.safety.sections.map(function (s) {
        var list = h(s.numbered ? "ol" : "ul", null, (s.items || []).map(function (i) { return h("li", { text: i }); }));
        return h("section", null, h("h2", { text: s.heading }), s.intro ? h("p", { text: s.intro }) : null, list, s.outro ? h("p", { text: s.outro }) : null);
      })));
  }
  var termsEl = document.getElementById("foot-terms");
  if (termsEl && D.terms) {
    add(termsEl, [
      h("p", { text: D.terms.summary }),
      h("details", { class: "terms" },
        h("summary", { text: "Terms of use and disclaimer (updated " + D.terms.updated + ")" }),
        D.terms.sections.map(function (s) {
          return h("section", null, h("h2", { text: s.heading }), s.body.map(function (p) { return h("p", { text: p }); }));
        })),
    ]);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
